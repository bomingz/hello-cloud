<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A little space on the web. Welcome to Hello Cloud.">
    <title>Hello Cloud</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #1e293b; background: #f5f7fb; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: 100%; max-width: 640px; padding: clamp(32px, 7vw, 64px); background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; }
      .mark { font-size: 40px; }
      .eyebrow { color: #4f46e5; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; margin-top: 32px; }
      h1 { font-size: clamp(40px, 8vw, 64px); line-height: 1.05; letter-spacing: -.05em; margin: 16px 0; }
      .intro { font-size: 18px; line-height: 1.7; color: #64748b; margin-bottom: 0; }
      footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid #e2e8f0; font-size: 13px; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">☁</div>
      <p class="eyebrow">A little space on the web</p>
      <h1>Hello, cloud.</h1>
      <p class="intro">Every great idea starts somewhere.<br>Welcome to my small corner of the internet.</p>
      <footer>Made simple. Hosted on GitHub Pages.</footer>
    </main>
  </body>
</html>
